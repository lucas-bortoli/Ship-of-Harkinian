name: generate-builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    # Fork pull requests cannot access the SDK download secret.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Validate release tag
      if: ${{ github.ref_type == 'tag' }}
      run: |
        if (-not $env:GITHUB_REF_NAME.EndsWith('-rich-presence', [System.StringComparison]::Ordinal)) {
          throw 'Release tags must end in -rich-presence (for example, 9.3.1-rich-presence).'
        }
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up Discord Social SDK
      env:
        DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
        DISCORD_SOCIAL_SDK_SHA256: ${{ vars.DISCORD_SOCIAL_SDK_SHA256 }}
      run: ./.github/scripts/setup-discord-sdk.ps1
    - name: Install dependencies
      run: |
        choco install ninja -y
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item -LiteralPath 'C:\ProgramData\Chocolatey\bin\ccache.exe' -Force -ErrorAction SilentlyContinue
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.ref_name == github.event.repository.default_branch }}
        key: ${{ runner.os }}-x64-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-x64-ccache-${{ github.ref }}
          ${{ runner.os }}-x64-ccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ github.ref }}-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Configure SoH
      env:
        VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      run: >-
        cmake -S . -B build-windows -G Ninja
        -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release
        -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DBUILD_REMOTE_CONTROL=1 "-DSOH_DISCORD_SDK_ROOT=$env:SOH_DISCORD_SDK_ROOT"
    - name: Build SoH and soh.o2r
      run: cmake --build build-windows --config Release --parallel 10
    - name: Package SoH
      working-directory: build-windows
      run: cpack -C Release -G ZIP
    - name: Verify package contents
      run: |
        $packages = @(Get-ChildItem -Path '_packages/*-rich-presence.zip')
        if ($packages.Count -ne 1) { throw 'Expected one Windows package ending in -rich-presence.zip.' }
        Expand-Archive -LiteralPath $packages[0].FullName -DestinationPath soh-windows-rich-presence
        foreach ($file in 'soh.exe', 'soh.o2r', 'discord_partner_sdk.dll') {
          if (-not (Test-Path -LiteralPath "soh-windows-rich-presence/$file" -PathType Leaf)) {
            throw "The Windows package is missing $file."
          }
        }
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-windows-rich-presence
        path: _packages/*-rich-presence.zip
        if-no-files-found: error
    - name: Save Cache VCPKG folder
      if: ${{ github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg
